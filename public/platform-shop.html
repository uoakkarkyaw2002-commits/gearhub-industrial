<!doctype html>
<html lang="my">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>GearHub Shop</title>
    <link rel="stylesheet" href="/platform.css" />
  </head>
  <body>
    <header>
      <a href="/">GearHub platform</a
      ><a href="/platform.html">My shop / ဆိုင်ဖွင့်ရန်</a>
    </header>
    <main>
      <p id="message" role="status"></p>
      <section id="shop-info"></section>
      <label>Search / ရှာရန် <input id="shop-search" type="search" /></label>
      <section id="shop-products" class="grid"></section>
      <section>
        <h2>Cart / ခြင်းတောင်း</h2>
        <div id="shop-cart"></div>
        <form id="shop-checkout">
          <h2>Manual payment / ငွေလွှဲအတည်ပြုခြင်း</h2>
          <p id="payment-info"></p>
          <label
            >Name / အမည်<input
              name="customer"
              required
              maxlength="120" /></label
          ><label
            >Phone / ဖုန်း<input name="phone" required maxlength="40" /></label
          ><label
            >Address / လိပ်စာ<textarea
              name="address"
              required
              maxlength="500"
            ></textarea></label
          ><label
            >Transfer reference<input
              name="paymentReference"
              maxlength="100" /></label
          ><label
            >Receipt / ငွေလွှဲပြေစာ<input
              name="file"
              type="file"
              accept="image/jpeg,image/png,image/webp"
              required
          /></label>
          <p>ဆိုင်ရှင်က ငွေလွှဲကို လက်ဖြင့် အတည်ပြုပေးပါမည်။</p>
          <button>Place order / အော်ဒါတင်ရန်</button>
        </form>
      </section>
    </main>
    <script src="/platform-shop.js"></script>
    <script src="/updates.js"></script>
  </body>
</html>
